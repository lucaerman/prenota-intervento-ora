<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione intervento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

body{
    background:linear-gradient(135deg,#1e3a8a,#3b82f6);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#1e3a8a;
}

.input-group{
    margin-bottom:12px;
}

input, select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
}

input:focus, select:focus{
    outline:none;
    border-color:#3b82f6;
}

label{
    font-size:13px;
    color:#666;
    margin-bottom:5px;
    display:block;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#1e3a8a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(0.98);
}

.modal{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    top:0;left:0;
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    width:90%;
    max-width:320px;
}

.box button{
    width:45%;
    margin:5px;
    padding:12px;
}

.ok{background:#1e3a8a;color:white;}
.no{background:#ccc;}

.success{
    display:none;
    text-align:center;
    color:#16a34a;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h2>Prenota intervento</h2>

<div class="input-group">
<input type="text" id="nome" placeholder="Nome">
</div>

<div class="input-group">
<input type="text" id="cognome" placeholder="Cognome">
</div>

<div class="input-group">
<input type="text" id="indirizzo" placeholder="Indirizzo completo">
</div>

<div class="input-group">
<input type="tel" id="telefono" placeholder="Telefono">
</div>

<div class="input-group">
<input type="tel" id="telefono_fisso" placeholder="Telefono fisso (facoltativo)">
</div>

<div class="input-group">
<input type="text" id="marca" placeholder="Marca stufa">
</div>

<div class="input-group">
<input type="text" id="modello" placeholder="Modello stufa (facoltativo)">
</div>

<div class="input-group">
<select id="tipoIntervento">
<option value="">Tipologia intervento</option>
<option value="Manutenzione">Manutenzione</option>
<option value="Riparazione">Riparazione</option>
<option value="Prima accensione">Prima accensione</option>
</select>
</div>

<div class="input-group">
<label>Data prenotazione</label>
<input type="text" id="data" readonly>
</div>

<button id="btn">📲 Prenota su WhatsApp</button>

<div class="success" id="successMsg">
✅ Apri WhatsApp e premi INVIA
</div>

</div>

<!-- MODALE -->
<div class="modal" id="modal">
<div class="box">
<h3>Conferma</h3>
<p>Inviare la prenotazione su WhatsApp?</p>
<button class="no" id="annulla">Annulla</button>
<button class="ok" id="conferma">Invia</button>
</div>
</div>

<script>

// DATA ITALIANA
window.onload=function(){
    let oggi=new Date();
    let g=String(oggi.getDate()).padStart(2,'0');
    let m=String(oggi.getMonth()+1).padStart(2,'0');
    let a=oggi.getFullYear();
    document.getElementById("data").value=g+"/"+m+"/"+a;
};

let messaggio="";

document.getElementById("btn").onclick=function(){

    let nome=document.getElementById("nome").value;
    let cognome=document.getElementById("cognome").value;
    let indirizzo=document.getElementById("indirizzo").value;
    let telefono=document.getElementById("telefono").value;
    let telefonoFisso=document.getElementById("telefono_fisso").value;
    let marca=document.getElementById("marca").value;
    let modello=document.getElementById("modello").value;
    let tipo=document.getElementById("tipoIntervento").value;
    let data=document.getElementById("data").value;

    if(!nome||!cognome||!indirizzo||!telefono||!marca||!tipo){
        alert("Compila tutti i campi obbligatori!");
        return;
    }

    messaggio=`Prenotazione intervento
Nome: ${nome} ${cognome}
Indirizzo: ${indirizzo}
Telefono: ${telefono}
Telefono fisso: ${telefonoFisso}
Marca stufa: ${marca}
Modello: ${modello}
Tipo intervento: ${tipo}
Data: ${data}`;

    document.getElementById("modal").style.display="flex";
};

// ANNULLA
document.getElementById("annulla").onclick=function(){
    document.getElementById("modal").style.display="none";
};

// CONFERMA
document.getElementById("conferma").onclick=function(){
    let url="https://wa.me/3930813769280?text="+encodeURIComponent(messaggio);
    window.open(url,"_blank");
    document.getElementById("modal").style.display="none";
    document.getElementById("successMsg").style.display="block";
};

</script>

</body>
</html>
