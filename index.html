<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione intervento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

body{
    background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.1;
    animation:move 60s linear infinite;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-200px,-200px);}
}

.container{
    position:relative;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
    animation:fadeIn 0.8s ease;
}

.container::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:25px;
    background:linear-gradient(45deg,#3b82f6,#22c55e,#3b82f6);
    z-index:-1;
    filter:blur(20px);
    opacity:0.5;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#fff;
    font-size:24px;
    letter-spacing:1px;
    position: relative;
}

.fire{
    display:inline-block;
    animation:fireContinuous 1s infinite alternate;
}

@keyframes fireContinuous{
    0% { transform: scale(1.1) rotate(-5deg); text-shadow: 0 0 5px #ff9800, 0 0 15px #ff5722, 0 0 25px #ff0000; }
    25% { transform: scale(1.3) rotate(5deg); text-shadow: 0 0 10px #ff9800, 0 0 25px #ff5722, 0 0 40px #ff0000; }
    50% { transform: scale(1.2) rotate(-3deg); text-shadow: 0 0 7px #ff9800, 0 0 20px #ff5722, 0 0 35px #ff0000; }
    75% { transform: scale(1.35) rotate(4deg); text-shadow: 0 0 12px #ff9800, 0 0 28px #ff5722, 0 0 45px #ff0000; }
    100% { transform: scale(1.1) rotate(-5deg); text-shadow: 0 0 5px #ff9800, 0 0 15px #ff5722, 0 0 25px #ff0000; }
}

/* SCINTILLE DELLA FIAMMA */
.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffec00;
    border-radius: 50%;
    opacity: 0;
    animation:sparkAnim 1s infinite;
}

@keyframes sparkAnim {
    0% { transform: translate(0,0) scale(0.5); opacity:1; }
    50% { transform: translate(calc(var(--x)*1px), calc(var(--y)*1px)) scale(1); opacity:0.5; }
    100% { transform: translate(calc(var(--x)*2px), calc(var(--y)*2px)) scale(0); opacity:0; }
}

.input-group{
    margin-bottom:12px;
}

input, select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

input::placeholder{
    color:#ddd;
}

input:focus, select:focus{
    background:rgba(255,255,255,0.25);
    transform:scale(1.03);
}

label{
    font-size:12px;
    color:#ccc;
    margin-bottom:5px;
    display:block;
}

/* PULSANTE WHATSAPP UFFICIALE ANIMATO */
button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    animation:pulse 2s infinite;
}

.whatsapp-icon{
    width:24px;
    height:24px;
    animation:iconBounce 1.2s infinite;
}

@keyframes iconBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
}

@keyframes pulse{
    0%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
    50%{ box-shadow:0 0 25px rgba(34,197,94,1);}
    100%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
}

button::before{
    content:"";
    position:absolute;
    width:200%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.7),transparent);
    top:0;
    left:-100%;
    animation:shine 3s infinite;
}

@keyframes shine{
    0%{left:-100%;}
    50%{left:100%;}
    100%{left:100%;}
}

button:active{
    transform:scale(0.95);
}

/* MODAL */
.modal{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    top:0;left:0;
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    background:#020617;
    color:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
    width:90%;
    max-width:320px;
}

.box button{
    width:45%;
    margin:5px;
    padding:12px;
}

.ok{background:#22c55e;}
.no{background:#555;}

.success{
    display:none;
    text-align:center;
    color:#22c55e;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h2>
  <span class="fire">🔥</span> Prenota intervento
  <div class="spark"
