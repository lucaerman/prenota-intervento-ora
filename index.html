    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Background profondo */
        body { 
            background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            overflow-x: hidden; 
        }

         /* --- SPLASH SCREEN PREMIUM (2.5s) --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .splash-logo {
            font-size: 90px;
            margin-bottom: 25px;
            animation: splashPulse 1.25s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.5));
        }

        @keyframes splashPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #ef4444); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 40px #ef4444); }
        }

        /* Contenitore barra */
        .loader-container {
            width: 240px;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Barra di caricamento con effetto Shimmer */
        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
            border-radius: 20px;
            animation: loadProgress 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
            position: relative;
        }

        /* Riflesso luce che scorre sulla barra */
        .loader-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 60%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .splash-text {
            color: #22c55e;
            margin-top: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
            animation: fadeText 2.5s infinite;
        }

        @keyframes fadeText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        }
        .splash-logo {
            font-size: 80px;
            animation: splashPulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes splashPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ef4444); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 30px #ef4444); }
        }
        .splash-text {
            color: white;
            margin-top: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* --- CONTAINER PRINCIPALE --- */
        .container { 
            width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.1);
            opacity: 0; transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* Classe attivata via JS dopo lo splash */
        .container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .header-box { text-align: center; margin-bottom: 20px; }
        h2 { color: #fff; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; animation: titleColorShift 4s infinite ease-in-out; }
        .fire-icon { display: inline-block; animation: firePulse 1.5s infinite alternate ease-in-out; }

        @keyframes titleColorShift {
            0%, 100% { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
            50% { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        }

        @keyframes firePulse {
            from { transform: scale(1); filter: drop-shadow(0 0 2px #ef4444); }
            to { transform: scale(1.2) translateY(-3px); filter: drop-shadow(0 0 10px #ef4444); }
        }

        .progress-container { width: 100%; background: rgba(0, 0, 0, 0.3); border-radius: 50px; margin-bottom: 25px; height: 24px; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ef4444, #eab308, #22c55e); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .progress-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); pointer-events: none; text-transform: uppercase; letter-spacing: 1px; }

        /* Effetto cascata sugli input */
        .input-group, .field-row, label { 
            opacity: 0; 
            transform: translateY(15px);
        }
        .active .input-group, .active .field-row, .active label {
            animation: slideUpFade 0.5s ease forwards;
        }
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Delay per l'effetto cascata */
        .active label:nth-of-type(1) { animation-delay: 0.1s; }
        .active .input-group:nth-of-type(1) { animation-delay: 0.2s; }
        .active .input-group:nth-of-type(2) { animation-delay: 0.3s; }
        .active .field-row:nth-of-type(1) { animation-delay: 0.4s; }

        label { font-size: 10px; color: #22c55e; margin-bottom: 5px; display: block; margin-left: 5px; text-transform: uppercase; font-weight: 700; }
        .field-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .field-container { position: relative; display: flex; align-items: center; width: 100%; }
        .field-icon { position: absolute; left: 12px; font-size: 16px; pointer-events: none; }

        input, select, textarea { width: 100%; padding: 12px 12px 12px 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #22c55e; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        
        #installBox { display:none; margin-bottom:15px; padding:12px; border:1px solid #22c55e; border-radius:12px; background:rgba(34,197,94,0.1); color:white; text-align:center; }
        #installBtn { width:100%; padding:12px; border:none; border-radius:10px; background:#22c55e; color:white; font-weight:bold; cursor: pointer; }

        button#mainBtn { 
            width: 100%; padding: 18px; margin-top: 15px; border: none; border-radius: 14px; 
            background: linear-gradient(45deg, #22c55e, #16a34a, #22c55e); background-size: 200% auto;
            color: white; font-size: 16px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            animation: pulseGlow 2s infinite, gradientMove 3s linear infinite;
        }

        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .preview-box { background: rgba(2, 6, 23, 0.6); border: 1px solid #22c55e; border-radius: 12px; padding: 12px; margin-top: 15px; font-size: 13px; color: #22c55e; display: none; white-space: pre-line; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .box { background: #0f172a; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 320px; border: 1px solid #22c55e; }
        .ok { background: #22c55e; width: 100%; padding: 12px; border:none; border-radius: 10px; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer;}
        .no { background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 13px; }
        select option { background-color: #0f172a; color: #ffffff; }
    </style>
</head>

    function popola() {
        const dl = document.getElementById("listaCitta");
        const tutti = [...comuniNA.map(c => ({n:c, p:"NA"})), ...comuniSA.map(c => ({n:c, p:"SA"}))];
        tutti.sort((a,b) => a.n.localeCompare(b.n)).forEach(c => {
            let o = document.createElement("option");
            o.value = c.n;
            o.dataset.p = c.p;
            dl.appendChild(o);
        });
    }

    const fields = ["nomeCompleto","indirizzo","citta","provincia","telefono","fisso","marca","modello"];
    fields.forEach(id => {
        const el = document.getElementById(id);
        const saved = localStorage.getItem(id);
        if(saved) el.value = saved;
        el.addEventListener("input", () => {
            localStorage.setItem(id, el.value);
            updateUI();
        });
    });

    document.getElementById("citta").addEventListener("input", function() {
        const val = this.value;
        const opts = document.getElementById("listaCitta").childNodes;
        for(let i=0; i<opts.length; i++) {
            if(opts[i].value === val) {
                document.getElementById("provincia").value = opts[i].dataset.p;
                break;
            }
        }
    });

    function updateUI() {
        const essential = ["nomeCompleto", "indirizzo", "citta", "provincia", "telefono", "marca", "tipoIntervento"];
        let filled = 0;
        essential.forEach(id => {
            if(document.getElementById(id).value.trim() !== "") filled++;
        });

        const percent = Math.round((filled / essential.length) * 100);
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("progressText").innerText = percent + "% COMPLETATO";

        const preview = document.getElementById("previewBox");
        const d = (id) => document.getElementById(id).value.trim();

        let testoPreview = "";
        if(d("nomeCompleto")) testoPreview += `👤 Cliente: ${d("nomeCompleto")}\n`;
        if(d("indirizzo"))    testoPreview += `📍 Indirizzo: ${d("indirizzo")} - ${d("citta")} (${d("provincia")})\n`;
        if(d("marca"))        testoPreview += `🔥 Stufa: ${d("marca")} ${d("modello")}\n`;
        if(d("tipoIntervento")) testoPreview += `🧰 Servizio: ${d("tipoIntervento")}`;

        preview.style.display = (testoPreview !== "") ? "block" : "none";
        preview.innerText = testoPreview;
        
        const tipo = document.getElementById("tipoIntervento").value;
        document.getElementById("sezioneProblemi").style.display = (tipo === "Prima accensione") ? "none" : "block";
    }

    document.querySelectorAll('input, select, textarea').forEach(el => {
        el.addEventListener('input', updateUI);
        el.addEventListener('change', updateUI);
    });

    document.getElementById("problema").addEventListener("change", function() {
        document.getElementById("erroriDisplayGroup").style.display = (this.value === "Errore sul display") ? "block" : "none";
        document.getElementById("altroBox").style.display = (this.value === "Altro" || this.value === "Rumore eccessivo") ? "block" : "none";
    });

    document.getElementById("mainBtn").onclick = function() {
        const d = (id) => document.getElementById(id).value.trim();
        if (!d("nomeCompleto") || !d("indirizzo") || !d("citta") || !d("provincia") || !d("telefono") || !d("marca") || !d("tipoIntervento")) {
            alert("⚠️ Compila tutti i dati obbligatori.");
            return;
        }

        const tipo = d("tipoIntervento");
        let dettaglio = "";
        if (tipo !== "Prima accensione") {
            dettaglio = d("problema");
            if (dettaglio === "Errore sul display") dettaglio = "Allarme: " + d("listaErrori");
            if (d("problemaAltro")) dettaglio += (dettaglio ? " - " : "") + "Note: " + d("problemaAltro");
        }

        const messaggio = `*🔥 NUOVA RICHIESTA ASSISTENZA*\n------------------------------\n👤 *Cliente:* ${d("nomeCompleto")}\n📍 *Indirizzo:* ${d("indirizzo")}\n🏙️ *Città:* ${d("citta")} (${d("provincia").toUpperCase()})\n📱 *Tel:* ${d("telefono")}${d("fisso") ? " / " + d("fisso") : ""}\n🔥 *Stufa:* ${d("marca")} ${d("modello")}\n🧰 *Servizio:* ${tipo}\n${dettaglio ? "🛠️ *Dettaglio:* " + dettaglio + "\n" : ""}📅 *Data:* ${new Date().toLocaleDateString('it-IT')}`;
        
        const url = "https://api.whatsapp.com/send?phone=390813769280&text=" + encodeURIComponent(messaggio);
        document.getElementById("modal").style.display = "flex";
        document.getElementById("conferma").onclick = () => { window.open(url, "_blank"); document.getElementById("modal").style.display = "none"; };
    };

    document.getElementById("annulla").onclick = () => document.getElementById("modal").style.display="none";
    
    // PWA & INSTALLATION LOGIC
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js');
    }

    let deferredPrompt;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const installBox = document.getElementById("installBox");

    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!isIOS) installBox.style.display = "block";
    });

    if (isIOS) {
        installBox.style.display = "block";
        document.getElementById("iosHint").style.display = "block";
        document.getElementById("installBtn").style.display = "none";
    }

    document.getElementById("installBtn").addEventListener("click", async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
            installBox.style.display = "none";
        }
    });

    popola();
    updateUI();
</script>
</body>
</html>
