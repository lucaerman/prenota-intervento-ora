<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prenotazione Intervento</title>
    <style>
        /* RESET GENERALE PER COMPATIBILITÀ CROSS-BROWSER */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* CONTAINER CON EFFETTO VETRO */
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 { text-align: center; margin-bottom: 25px; color: #fff; font-size: 24px; animation: titleGlow 2s infinite alternate; }
        @keyframes titleGlow { 0% { text-shadow: 0 0 5px #3b82f6; } 100% { text-shadow: 0 0 15px #22c55e; } }

        .input-group { margin-bottom: 18px; }
        label { font-size: 11px; color: #aaa; margin-bottom: 6px; display: block; margin-left: 5px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

        /* STILE INPUT, SELECT E TEXTAREA */
        .field-container { position: relative; display: flex; align-items: center; }
        .field-icon { position: absolute; left: 12px; font-size: 18px; z-index: 2; pointer-events: none; }

        input, select, textarea { 
            width: 100%; 
            padding: 14px 40px 14px 40px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255, 255, 255, 0.1); 
            color: #ffffff !important; 
            font-size: 16px; 
            outline: none; 
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        /* FIX CRITICO: Colore opzioni menu a tendina per PC e Mobile */
        select option {
            background-color: #111827; /* Fondo scuro solido */
            color: #ffffff;            /* Testo bianco */
            padding: 10px;
        }

        /* Freccetta personalizzata per i select (dato che appearance:none la rimuove) */
        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after {
            content: "▼";
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        input:focus, select:focus, textarea:focus { 
            background: rgba(255, 255, 255, 0.18); 
            border-color: #22c55e; 
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
        }

        /* BOTTONE WHATSAPP */
        button#mainBtn { 
            width: 100%; 
            padding: 16px; 
            margin-top: 10px; 
            border: none; 
            border-radius: 14px; 
            background: linear-gradient(45deg, #22c55e, #16a34a); 
            color: white; 
            font-size: 17px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            transition: transform 0.2s, brightness 0.2s;
        }
        button#mainBtn:active { transform: scale(0.97); }
        button#mainBtn:hover { brightness: 1.1; }

        /* MODALE DI CONFERMA */
        .modal { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.85); top: 0; left: 0; display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .box { background: #0f172a; color: #fff; padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 1px solid #22c55e; }
        .box h3 { margin-bottom: 10px; }
        .ok { background: #22c55e; margin-bottom: 10px; width: 100%; padding: 14px; border:none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .no { background: #334155; width: 100%; padding: 14px; border:none; border-radius: 12px; color: white; cursor: pointer; }
        
        textarea { height: 100px; resize: none; padding-top: 14px; }

        /* Placeholder color per tutti i browser */
        ::placeholder { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Prenota Intervento</h2>

    <div class="input-group">
        <label>Dati Anagrafici</label>
        <div class="field-container">
            <span class="field-icon">👤</span>
            <input type="text" id="nome" placeholder="Nome">
        </div>
    </div>
    <div class="input-group">
        <div class="field-container">
            <span class="field-icon">👤</span>
            <input type="text" id="cognome" placeholder="Cognome">
        </div>
    </div>

    <div class="input-group">
        <label>Contatti e Luogo</label>
        <div class="field-container">
            <span class="field-icon">📍</span>
            <input type="text" id="indirizzo" placeholder="Indirizzo (Via, Civico, Città)">
        </div>
    </div>
    <div class="input-group">
        <div class="field-container">
            <span class="field-icon">📱</span>
            <input type="tel" id="telefono" placeholder="Telefono Cellulare">
        </div>
    </div>

    <div class="input-group">
        <label>Dettagli Prodotto</label>
        <div class="field-container">
            <span class="field-icon">🔥</span>
            <input type="text" id="marca" placeholder="Marca della stufa">
        </div>
    </div>

    <div class="input-group">
        <label>Tipo di Assistenza</label>
        <div class="select-wrapper">
            <div class="field-container">
                <span class="field-icon">🧰</span>
                <select id="tipoIntervento">
                    <option value="">Seleziona tipo intervento...</option>
                    <option value="Manutenzione">Manutenzione</option>
                    <option value="Riparazione">Riparazione</option>
                    <option value="Prima accensione">Prima accensione</option>
                </select>
            </div>
        </div>
    </div>

    <div id="sezioneProblemi">
        <div class="input-group">
            <label>Malfunzionamento</label>
            <div class="select-wrapper">
                <div class="field-container">
                    <span class="field-icon">🛠️</span>
                    <select id="problema">
                        <option value="">Seleziona il problema...</option>
                        <option value="Stufa non si accende">Stufa non si accende</option>
                        <option value="Errore sul display">Errore sul display ⚠️</option>
                        <option value="Si spegne da sola">Si spegne da sola</option>
                        <option value="Non carica pellet">Non carica pellet</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group" id="erroriDisplayGroup" style="display:none;">
            <label>Codice Errore Visualizzato</label>
            <div class="select-wrapper">
                <div class="field-container">
                    <span class="field-icon">📟</span>
                    <select id="listaErrori">
                        <option value="">Quale errore appare?</option>
                        <option value="Errore Sonda K">Errore Sonda K</option>
                        <option value="Errore Autopulizia">Errore Autopulizia</option>
                        <option value="Errore Pressione">Errore Pressione</option>
                        <option value="Errore Debimetro">Errore Debimetro</option>
                        <option value="Errore Porta Aperta">Errore Porta Aperta</option>
                        <option value="Errore Depressione">Errore Depressione</option>
                        <option value="Errore Sicurezza">Errore Sicurezza Termica</option>
                        <option value="Altro">Altro errore non in lista</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group" id="altroBox" style="display:none;">
            <div class="field-container">
                <span class="field-icon">📝</span>
                <textarea id="problemaAltro" placeholder="Descrivi qui brevemente il problema..."></textarea>
            </div>
        </div>
    </div>

    <button id="mainBtn">Invia su WhatsApp</button>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3>Conferma Invio</h3>
        <p style="margin-bottom: 20px; font-size: 14px; color: #cbd5e1;">Verrai indirizzato alla chat di WhatsApp per completare l'invio.</p>
        <button class="ok" id="conferma">SÌ, PROCEDI</button>
        <button class="no" id="annulla">MODIFICA</button>
    </div>
</div>

<script>
    let messaggioWhatsApp = "";

    const tipoSelect = document.getElementById("tipoIntervento");
    const sezioneProblemi = document.getElementById("sezioneProblemi");
    const selectProblema = document.getElementById("problema");
    const erroriDisplayGroup = document.getElementById("erroriDisplayGroup");
    const altroBox = document.getElementById("altroBox");

    // Mostra/Nasconde campi in base al tipo intervento
    tipoSelect.onchange = function() {
        sezioneProblemi.style.display = (this.value === "Prima accensione") ? "none" : "block";
    };

    // Mostra/Nasconde dettagli errore
    selectProblema.onchange = function() {
        erroriDisplayGroup.style.display = (this.value === "Errore sul display") ? "block" : "none";
        altroBox.style.display = (this.value === "Altro") ? "block" : "none";
    };

    document.getElementById("mainBtn").onclick = function() {
        const nome = document.getElementById("nome").value.trim();
        const cognome = document.getElementById("cognome").value.trim();
        const indirizzo = document.getElementById("indirizzo").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const marca = document.getElementById("marca").value.trim();
        const tipo = tipoSelect.value;

        // Validazione
        if (!nome || !cognome || !indirizzo || !telefono || !marca || !tipo) {
            alert("⚠️ Attenzione: Compila tutti i campi obbligatori per continuare.");
            return;
        }

        let dettaglio = "";
        if (tipo !== "Prima accensione") {
            dettaglio = selectProblema.value;
            if (dettaglio === "Errore sul display") dettaglio = "Errore: " + document.getElementById("listaErrori").value;
            if (dettaglio === "Altro") dettaglio = "Dettaglio: " + document.getElementById("problemaAltro").value;
            
            if (!selectProblema.value) { alert("⚠️ Indica il problema riscontrato."); return; }
        }

        const dataOggi = new Date().toLocaleDateString('it-IT');

        messaggioWhatsApp = `*🔥 NUOVA RICHIESTA ASSISTENZA*\n` +
                            `------------------------------\n` +
                            `👤 *Cliente:* ${nome} ${cognome}\n` +
                            `📍 *Indirizzo:* ${indirizzo}\n` +
                            `📱 *WhatsApp:* ${telefono}\n` +
                            `🔥 *Stufa:* ${marca}\n` +
                            `🧰 *Intervento:* ${tipo}\n` +
                            (dettaglio ? `🛠️ *Problema:* ${dettaglio}\n` : "") +
                            `📅 *Data:* ${dataOggi}`;

        document.getElementById("modal").style.display = "flex";
    };

    document.getElementById("annulla").onclick = () => document.getElementById("modal").style.display="none";
    
    document.getElementById("conferma").onclick = () => {
        const url = "https://wa.me/390813769280?text=" + encodeURIComponent(messaggioWhatsApp);
        window.open(url, "_blank");
        document.getElementById("modal").style.display="none";
    };
</script>
</body>
</html>
