<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione intervento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

body{
    background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* SFONDO “SCINTILLE PELLET” */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at center, rgba(255,200,0,0.05) 1px, transparent 1px);
    background-size:20px 20px;
    pointer-events:none;
    animation:riseSparks 8s linear infinite;
    z-index:-1;
}

@keyframes riseSparks{
    0%{background-position:0 100%;}
    100%{background-position:0 -100%;}
}

body::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle, rgba(255,140,0,0.1) 2px, transparent 2px);
    background-size:40px 40px;
    animation:twinkleSparks 4s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:-1;
}

@keyframes twinkleSparks{
    0%{opacity:0.05; transform:translateY(0);}
    50%{opacity:0.2; transform:translateY(-10px);}
    100%{opacity:0.05; transform:translateY(0);}
}

/* CONTAINER */
.container{
    position:relative;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
}

/* TITOLO */
h2{
    text-align:center;
    color:#fff;
    margin-bottom:20px;
}

.fire{
    display:inline-block;
    animation:fireContinuous 1s infinite alternate;
}

@keyframes fireContinuous{
    0% { transform: scale(1.1) rotate(-5deg); text-shadow: 0 0 5px #ff9800, 0 0 15px #ff5722, 0 0 25px #ff0000; }
    100% { transform: scale(1.3) rotate(5deg); text-shadow: 0 0 12px #ff9800, 0 0 30px #ff5722, 0 0 45px #ff0000; }
}

/* SCINTILLE */
.spark{
    position:absolute;
    width:4px;
    height:4px;
    background:#ffec00;
    border-radius:50%;
    opacity:0;
    animation:sparkAnim 1.2s infinite;
}

@keyframes sparkAnim{
    0% { transform: translate(0,0) scale(0.5); opacity:1; }
    50% { transform: translate(calc(var(--x)*1px), calc(var(--y)*1px)) scale(1); opacity:0.5; }
    100% { transform: translate(calc(var(--x)*2px), calc(var(--y)*2px)) scale(0); opacity:0; }
}

/* INPUT */
.input-group{
    position:relative;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:14px 14px 14px 45px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    outline:none;
}

textarea{
    width:100%;
    min-height:90px;
    padding:14px 14px 14px 45px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    outline:none;
    resize:none;
}

input::placeholder, textarea::placeholder{
    color:#ddd;
}

input:focus,select:focus,textarea:focus{
    background:rgba(255,255,255,0.25);
    transform:scale(1.02);
}

/* ICONE */
.icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:0.8;
}

/* ERRORE */
.error{
    border:2px solid red !important;
}

/* BOTTONE WHATSAPP */
button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    position:relative;
    overflow:hidden;
    animation:pulse 2s infinite;
}

.whatsapp-icon{
    width:24px;
    animation:iconBounce 1.2s infinite;
}

@keyframes iconBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
}

@keyframes pulse{
    0%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
    50%{ box-shadow:0 0 25px rgba(34,197,94,1);}
    100%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
}

button::before{
    content:"";
    position:absolute;
    width:200%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.7),transparent);
    top:0;
    left:-100%;
    animation:shine 3s infinite;
}

@keyframes shine{
    0%{left:-100%;}
    50%{left:100%;}
    100%{left:100%;}
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(6px);
}

.box{
    background:#020617;
    color:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

/* SUCCESS IOS */
.successOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:0.4s;
}

.successOverlay.active{
    opacity:1;
}

.successBox{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:scale(0.5);
    animation:pop 0.5s forwards;
}

@keyframes pop{
    to{transform:scale(1);}
}

.check{
    font-size:50px;
    color:white;
    animation:fadeIn 0.5s 0.3s forwards;
    opacity:0;
}

@keyframes fadeIn{
    to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<h2>
<span class="fire">🔥</span> Prenota intervento
<div class="spark" style="--x:10; --y:-20;"></div>
<div class="spark" style="--x:-15; --y:-25;"></div>
<div class="spark" style="--x:5; --y:-30;"></div>
</h2>

<div class="input-group"><span class="icon">👤</span><input id="nome" placeholder="Nome"></div>
<div class="input-group"><span class="icon">👤</span><input id="cognome" placeholder="Cognome"></div>
<div class="input-group"><span class="icon">📍</span><input id="indirizzo" placeholder="Indirizzo"></div>
<div class="input-group"><span class="icon">📞</span><input id="telefono" placeholder="Telefono"></div>
<div class="input-group"><span class="icon">🔥</span><input id="marca" placeholder="Marca stufa"></div>

<div class="input-group">
<span class="icon">🛠</span>
<select id="tipo">
<option value="">Tipo intervento</option>
<option>Manutenzione</option>
<option>Riparazione</option>
<option>Prima accensione</option>
</select>
</div>

<div class="input-group">
<span class="icon">📝</span>
<textarea id="note" placeholder="Descrivi brevemente il problema (facoltativo)"></textarea>
</div>

<div class="input-group">
<span class="icon">📅</span>
<input id="data" readonly>
</div>

<button id="btn">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="whatsapp-icon">
Prenota su WhatsApp
</button>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">
<h3>Conferma invio</h3>
<button onclick="invia()">Invia</button>
<button onclick="modal.style.display='none'">Annulla</button>
</div>
</div>

<!-- SUCCESS -->
<div class="successOverlay" id="success">
<div class="successBox">
<div class="check">✓</div>
</div>
</div>

<script>

data.value=new Date().toLocaleDateString("it-IT");

let msg="";

btn.onclick=()=>{

let campi=["nome","cognome","indirizzo","telefono","marca","tipo"];
let ok=true;

campi.forEach(id=>{
let el=document.getElementById(id);
el.classList.remove("error");
if(!el.value){
el.classList.add("error");
ok=false;
}
});

if(!ok) return;

if(navigator.vibrate) navigator.vibrate(100);

msg=`Prenotazione intervento

Nome: ${nome.value} ${cognome.value}
Indirizzo: ${indirizzo.value}
Telefono: ${telefono.value}

Marca: ${marca.value}
Tipo: ${tipo.value}
Data: ${data.value}

${note.value ? "Problema: " + note.value : ""}`;

modal.style.display="flex";

};

function invia(){

modal.style.display="none";
success.classList.add("active");

setTimeout(()=>{
success.classList.remove("active");
window.open("https://wa.me/390813769280?text="+encodeURIComponent(msg));
},1500);

}

</script>

</body>
</html>
