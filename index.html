<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prenotazione intervento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

body{
    background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* TITLE */
h2{
    text-align:center;
    color:#fff;
    margin-bottom:20px;
}

/* INPUT */
.input-group{
    position:relative;
    margin-bottom:14px;
}

input,select{
    width:100%;
    padding:14px 14px 14px 42px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    outline:none;
}

input:focus,select:focus{
    background:rgba(255,255,255,0.25);
    transform:scale(1.02);
}

/* ICONE */
.icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.7;
}

/* ERRORE */
.error{
    border:2px solid #ef4444 !important;
}

/* BUTTON */
button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(6px);
}

.box{
    background:#020617;
    padding:25px;
    border-radius:15px;
    text-align:center;
    color:#fff;
}

.success{
    display:none;
    color:#22c55e;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>🔥 Prenota intervento</h2>

<div class="input-group">
<span class="icon">👤</span>
<input id="nome" placeholder="Nome" autocomplete="given-name">
</div>

<div class="input-group">
<span class="icon">👤</span>
<input id="cognome" placeholder="Cognome" autocomplete="family-name">
</div>

<div class="input-group">
<span class="icon">📍</span>
<input id="indirizzo" placeholder="Indirizzo">
</div>

<div class="input-group">
<span class="icon">📞</span>
<input id="telefono" placeholder="Telefono" autocomplete="tel">
</div>

<div class="input-group">
<span class="icon">☎️</span>
<input id="telefono_fisso" placeholder="Telefono fisso">
</div>

<div class="input-group">
<span class="icon">🔥</span>
<input id="marca" placeholder="Marca stufa">
</div>

<div class="input-group">
<span class="icon">⚙️</span>
<input id="modello" placeholder="Modello">
</div>

<div class="input-group">
<span class="icon">🛠</span>
<select id="tipo">
<option value="">Tipo intervento</option>
<option>Manutenzione</option>
<option>Riparazione</option>
<option>Prima accensione</option>
</select>
</div>

<div class="input-group">
<span class="icon">📅</span>
<input id="data" readonly>
</div>

<button id="btn">📲 Prenota su WhatsApp</button>

<div class="success" id="ok">
✅ Apri WhatsApp e invia il messaggio
</div>

</div>

<div class="modal" id="modal">
<div class="box">
<h3>Conferma invio</h3>
<p>Vuoi inviare la richiesta?</p>
<button onclick="invia()">Invia</button>
<button onclick="chiudi()">Annulla</button>
</div>
</div>

<script>

/* DATA AUTOMATICA BLOCCATA */
let oggi=new Date();
document.getElementById("data").value =
oggi.toLocaleDateString("it-IT");

/* AUTOSALVATAGGIO */
["nome","cognome","indirizzo","telefono"].forEach(id=>{
let el=document.getElementById(id);
el.value=localStorage.getItem(id)||"";
el.oninput=()=>localStorage.setItem(id,el.value);
});

/* VALIDAZIONE */
let msg="";

document.getElementById("btn").onclick=()=>{

let campi=["nome","cognome","indirizzo","telefono","marca","tipo"];

let ok=true;

campi.forEach(id=>{
let el=document.getElementById(id);
el.classList.remove("error");
if(!el.value){
el.classList.add("error");
ok=false;
}
});

if(!ok) return;

/* vibrazione mobile */
if(navigator.vibrate) navigator.vibrate(100);

msg=`Prenotazione intervento

Nome: ${nome.value} ${cognome.value}
Indirizzo: ${indirizzo.value}
Telefono: ${telefono.value}

Marca: ${marca.value}
Modello: ${modello.value}

Tipo: ${tipo.value}
Data: ${data.value}`;

modal.style.display="flex";

};

/* MODAL */
function chiudi(){
modal.style.display="none";
}

function invia(){

window.open(
"https://wa.me/390813769280?text="+encodeURIComponent(msg),
"_blank"
);

modal.style.display="none";
ok.style.display="block";

document.getElementById("btn").innerText="✔ Inviato";

}

</script>

</body>
</html>
