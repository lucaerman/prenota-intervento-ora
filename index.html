<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prenotazione Intervento</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { 
            width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.1);
            animation: openingGlow 1.2s ease-out forwards;
        }

        @keyframes openingGlow { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .progress-container {
            width: 100%; background: rgba(0, 0, 0, 0.3); border-radius: 50px;
            margin-bottom: 25px; height: 24px; position: relative; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900; color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); pointer-events: none;
            text-transform: uppercase; letter-spacing: 1px;
        }

        h2 { text-align: center; margin-bottom: 15px; color: #fff; font-size: 22px; }
        label { font-size: 10px; color: #22c55e; margin-bottom: 5px; display: block; margin-left: 5px; text-transform: uppercase; font-weight: 700; }
        .input-group { margin-bottom: 15px; }
        .field-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .field-row .input-group { flex: 1; margin-bottom: 0; }
        .field-container { position: relative; display: flex; align-items: center; }
        .field-icon { position: absolute; left: 12px; font-size: 16px; pointer-events: none; }

        input, select, textarea { 
            width: 100%; padding: 12px 12px 12px 38px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255, 255, 255, 0.1); 
            color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #22c55e; background: rgba(255, 255, 255, 0.15); }

        button#mainBtn { 
            width: 100%; padding: 18px; margin-top: 15px; border: none; border-radius: 14px; 
            background: linear-gradient(45deg, #22c55e, #16a34a, #22c55e); background-size: 200% auto;
            color: white; font-size: 16px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            position: relative; overflow: hidden;
            animation: pulseGlow 2s infinite, gradientMove 3s linear infinite;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .wa-icon { width: 22px; height: 22px; fill: white; }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        button#mainBtn::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.2); transform: rotate(30deg); animation: shimmer 3s infinite;
        }

        @keyframes shimmer { 0% { left: -60%; } 30% { left: 120%; } 100% { left: 120%; } }

        .preview-box { 
            background: rgba(2, 6, 23, 0.6); border: 1px solid #22c55e; border-radius: 12px; 
            padding: 12px; margin-top: 15px; font-size: 13px; color: #22c55e; 
            display: none; white-space: pre-line; text-align: left;
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .box { background: #0f172a; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 320px; border: 1px solid #22c55e; }
        .ok { background: #22c55e; width: 100%; padding: 12px; border:none; border-radius: 10px; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer;}
        .no { background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 13px; }
        
        select option { background-color: #0f172a; color: #ffffff; }
        textarea { height: 80px; resize: none; padding-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Prenota Assistenza</h2>

    <div class="progress-container">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-text" id="progressText">0% COMPLETATO</div>
    </div>

    <div class="input-group">
        <label>Anagrafica</label>
        <div class="field-container">
            <input type="text" id="nomeCompleto" placeholder="Nome e Cognome">
            <span class="field-icon">👤</span>
        </div>
    </div>

    <div class="input-group">
        <div class="field-container">
            <input type="text" id="indirizzo" placeholder="Indirizzo (Via, Civico, Città)">
            <span class="field-icon">📍</span>
        </div>
    </div>

    <div class="field-row">
        <div class="input-group">
            <div class="field-container">
                <input type="tel" id="telefono" placeholder="Cellulare">
                <span class="field-icon">📱</span>
            </div>
        </div>
        <div class="input-group">
            <div class="field-container">
                <input type="tel" id="fisso" placeholder="Fisso (opz)">
                <span class="field-icon">📞</span>
            </div>
        </div>
    </div>

    <label>Dati Prodotto</label>
    <div class="field-row">
        <div class="input-group">
            <div class="field-container">
                <input type="text" id="marca" placeholder="Marca">
                <span class="field-icon">🔥</span>
            </div>
        </div>
        <div class="input-group">
            <div class="field-container">
                <input type="text" id="modello" placeholder="Modello">
                <span class="field-icon">⚙️</span>
            </div>
        </div>
    </div>

    <div class="input-group">
        <div class="field-container">
            <select id="tipoIntervento">
                <option value="">Tipo di intervento...</option>
                <option value="Manutenzione">Manutenzione</option>
                <option value="Riparazione">Riparazione</option>
                <option value="Prima accensione">Prima accensione</option>
            </select>
            <span class="field-icon">🧰</span>
        </div>
    </div>

    <div id="sezioneProblemi">
        <div class="input-group">
            <div class="field-container">
                <select id="problema">
                    <option value="">Seleziona problema (facoltativo)</option>
                    <option value="Errore sul display">Errore sul display ⚠️</option>
                    <option value="Mancata Accensione">Non si accende la fiamma</option>
                    <option value="Si spegne da sola">Si spegne durante il lavoro</option>
                    <option value="Vetro molto nero">Il vetro si sporca subito</option>
                    <option value="Rumore eccessivo">Fa un rumore anomalo</option>
                    <option value="Altro">Altro (specifica sotto)</option>
                </select>
                <span class="field-icon">🛠️</span>
            </div>
        </div>

        <div class="input-group" id="erroriDisplayGroup" style="display:none;">
            <div class="field-container">
                <select id="listaErrori">
                    <option value="">Seleziona l'allarme...</option>
                    <option value="AL 1 - Blackout">AL 1 - Blackout / Mancanza Rete</option>
                    <option value="AL 2 - Sonda Fumi">AL 2 - Sonda Fumi Guasta</option>
                    <option value="AL 3 - Hot Fumi">AL 3 - Hot Fumi (Eccessivo Calore)</option>
                    <option value="AL 4 - Aspiratore">AL 4 - Guasto Estrattore Fumi</option>
                    <option value="AL 5 - No Accensione">AL 5 - Mancata Accensione</option>
                    <option value="AL 6 - No Pellet">AL 6 - Mancanza Pellet / Fiamma</option>
                    <option value="AL 7 - Termico">AL 7 - Sicurezza Termica (Reset)</option>
                    <option value="AL 8 - No Depressione">AL 8 - Errore Depressione / Canna Fumaria</option>
                    <option value="AL 9 - Coclea">AL 9 - Blocco Sistema Carico Pellet</option>
                    <option value="SERVICE/PULIZIA">SERVICE/PULIZIA</option>
                    <option value="Errore Triac Coclea">Errore Triac Coclea</option>
                    <option value="Errore Sonda K">Errore Sonda K</option>
                    <option value="Errore Pulizia braciere">Errore Pulizia braciere</option>
                    <option value="Errore Pressione Alta">Errore Pressione Alta</option>
                    <option value="Errore Pressione Bassa">Errore Pressione Bassa</option>
                    <option value="Errore Debimetro/No flusso">Errore Debimetro/No flusso</option>
                    <option value="Errore Porta Apert/sportello pellet">Errore Porta Aperta/sportello pellet</option>
                    <option value="Errore NO SEGNALE">Errore NO SEGNALE</option>
                    <option value="Altro">Altro errore non in lista</option>
                </select>
                <span class="field-icon">📟</span>
            </div>
        </div>

        <div class="input-group" id="altroBox" style="display:none;">
            <div class="field-container">
                <textarea id="problemaAltro" placeholder="Descrivi brevemente qui..."></textarea>
                <span class="field-icon">📝</span>
            </div>
        </div>
    </div>

    <button id="mainBtn">
        <svg class="wa-icon" viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.4-8.6-44.6-27.5-16.4-14.7-27.5-32.8-30.7-38.4-3.2-5.6-.3-8.6 2.5-11.4 2.5-2.5 5.5-6.5 8.3-9.7 2.8-3.2 3.7-5.6 5.6-9.3 1.9-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
        INVIA SU WHATSAPP
    </button>
    <div class="preview-box" id="previewBox"></div>
    <div class="info-footer" style="text-align:center; margin-top:15px; font-size:12px; color:#aaa;">Compila i dati e premi invia ✅</div>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3>Conferma Invio</h3>
        <p style="margin-bottom: 20px; font-size: 14px; color: #cbd5e1;">Vuoi inviare la richiesta tecnica ora?</p>
        <button class="ok" id="conferma">SÌ, PROCEDI</button>
        <button class="no" id="annulla">MODIFICA</button>
    </div>
</div>

<script>
    // Configurazione campi e recupero LocalStorage
    const fields = ["nomeCompleto","indirizzo","telefono","fisso","marca","modello"];
    fields.forEach(id => {
        const el = document.getElementById(id);
        const saved = localStorage.getItem(id);
        if(saved) el.value = saved;
        el.addEventListener("input", () => {
            localStorage.setItem(id, el.value);
            updateUI();
        });
    });

    // Funzione Aggiornamento Interfaccia (Percentuale e Anteprima)
    function updateUI() {
        const essential = ["nomeCompleto", "indirizzo", "telefono", "marca", "tipoIntervento"];
        let filled = 0;
        essential.forEach(id => {
            if(document.getElementById(id).value.trim() !== "") filled++;
        });

        const percent = Math.round((filled / essential.length) * 100);
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("progressText").innerText = percent + "% COMPLETATO";

        const preview = document.getElementById("previewBox");
        const d = (id) => document.getElementById(id).value.trim();

        let testoPreview = "";
        if(d("nomeCompleto")) testoPreview += `👤 Cliente: ${d("nomeCompleto")}\n`;
        if(d("indirizzo"))    testoPreview += `📍 Indirizzo: ${d("indirizzo")}\n`;
        if(d("marca"))        testoPreview += `🔥 Stufa: ${d("marca")} ${d("modello")}\n`;
        if(d("tipoIntervento")) testoPreview += `🧰 Servizio: ${d("tipoIntervento")}`;

        if(testoPreview !== "") {
            preview.style.display = "block";
            preview.innerText = testoPreview;
        } else {
            preview.style.display = "none";
        }
        
        // Logica specifica: Prima Accensione nasconde i problemi
        const tipo = document.getElementById("tipoIntervento").value;
        document.getElementById("sezioneProblemi").style.display = (tipo === "Prima accensione") ? "none" : "block";
    }

    // Listener per tutti gli input per aggiornare la UI
    document.querySelectorAll('input, select, textarea').forEach(el => {
        el.addEventListener('input', updateUI);
        el.addEventListener('change', updateUI);
    });

    // Gestione visualizzazione dinamica sottocampi problemi
    document.getElementById("problema").addEventListener("change", function() {
        document.getElementById("erroriDisplayGroup").style.display = (this.value === "Errore sul display") ? "block" : "none";
        document.getElementById("altroBox").style.display = (this.value === "Altro" || this.value === "Rumore eccessivo") ? "block" : "none";
    });

    // LOGICA DI INVIO - OTTIMIZZATA PER PC E MOBILE
    document.getElementById("mainBtn").onclick = function() {
        const d = (id) => document.getElementById(id).value.trim();
        
        // Controllo validità
        if (!d("nomeCompleto") || !d("indirizzo") || !d("telefono") || !d("marca") || !d("tipoIntervento")) {
            alert("⚠️ Per favore, compila i dati principali.");
            return;
        }

        const tipo = d("tipoIntervento");
        let dettaglio = "";
        
        if (tipo !== "Prima accensione") {
            dettaglio = d("problema");
            if (dettaglio === "Errore sul display") {
                dettaglio = "Allarme: " + d("listaErrori");
            }
            if (d("problemaAltro")) {
                dettaglio += " - Note: " + d("problemaAltro");
            }
        }

        const dataOggi = new Date().toLocaleDateString('it-IT');

        // Costruzione del messaggio con caratteri sicuri
        const messaggio = 
            "*🔥 NUOVA RICHIESTA ASSISTENZA*\n" +
            "------------------------------\n" +
            "👤 *Cliente:* " + d("nomeCompleto") + "\n" +
            "📍 *Indirizzo:* " + d("indirizzo") + "\n" +
            "📱 *Tel:* " + d("telefono") + (d("fisso") ? " / " + d("fisso") : "") + "\n" + 
            "🔥 *Stufa:* " + d("marca") + " " + d("modello") + "\n" +
            "🧰 *Servizio:* " + tipo + "\n" +
            (dettaglio ? "🛠️ *Dettaglio:* " + dettaglio + "\n" : "") +
            "📅 *Data:* " + dataOggi;
        
        // Endpoint universale (api.whatsapp.com è più stabile per il passaggio dati da PC)
        const url = "https://api.whatsapp.com/send?phone=390813769280&text=" + encodeURIComponent(messaggio);
        
        // Mostra Modale
        document.getElementById("modal").style.display = "flex";
        
        // Azione al click su Conferma
        document.getElementById("conferma").onclick = function() {
            window.open(url, "_blank");
            document.getElementById("modal").style.display = "none";
            
            // Opzionale: pulizia dopo l'invio
            // localStorage.clear();
            // location.reload();
        };
    };

    // Chiusura modale
    document.getElementById("annulla").onclick = () => document.getElementById("modal").style.display="none";
    
    // Inizializzazione UI al caricamento
    updateUI();
</script>
</body>
</html>
