<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prenotazione Intervento</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 { text-align: center; margin-bottom: 25px; color: #fff; font-size: 24px; animation: titleGlow 2s infinite alternate; }
        @keyframes titleGlow { 0% { text-shadow: 0 0 5px #3b82f6; } 100% { text-shadow: 0 0 15px #22c55e; } }

        .input-group { margin-bottom: 18px; }
        label { font-size: 11px; color: #aaa; margin-bottom: 6px; display: block; margin-left: 5px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

        .field-container { position: relative; display: flex; align-items: center; }
        .field-icon { position: absolute; left: 12px; font-size: 18px; z-index: 2; pointer-events: none; }

        input, select, textarea { 
            width: 100%; 
            padding: 14px 40px 14px 40px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255, 255, 255, 0.1); 
            color: #ffffff !important; 
            font-size: 16px; 
            outline: none; 
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        /* FIX PER PC: Sfondo solido per i menu a tendina */
        select option {
            background-color: #0f172a; 
            color: #ffffff;
            padding: 10px;
        }

        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after {
            content: "▼";
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        input:focus, select:focus, textarea:focus { 
            background: rgba(255, 255, 255, 0.18); 
            border-color: #22c55e; 
        }

        button#mainBtn { 
            width: 100%; 
            padding: 16px; 
            margin-top: 10px; 
            border: none; 
            border-radius: 14px; 
            background: linear-gradient(45deg, #22c55e, #16a34a); 
            color: white; 
            font-size: 17px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            transition: transform 0.2s;
        }
        button#mainBtn:active { transform: scale(0.97); }

        .modal { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.85); top: 0; left: 0; display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .box { background: #0f172a; color: #fff; padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; border: 1px solid #22c55e; }
        .ok { background: #22c55e; margin-bottom: 10px; width: 100%; padding: 14px; border:none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .no { background: #334155; width: 100%; padding: 14px; border:none; border-radius: 12px; color: white; cursor: pointer; }
        
        textarea { height: 100px; resize: none; padding-top: 14px; }
        ::placeholder { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Prenota Intervento</h2>

    <div class="input-group">
        <label>Cliente</label>
        <div class="field-container">
            <span class="field-icon">👤</span>
            <input type="text" id="nome" placeholder="Nome">
        </div>
    </div>
    <div class="input-group">
        <div class="field-container">
            <span class="field-icon">👤</span>
            <input type="text" id="cognome" placeholder="Cognome">
        </div>
    </div>

    <div class="input-group">
        <label>Recapito</label>
        <div class="field-container">
            <span class="field-icon">📍</span>
            <input type="text" id="indirizzo" placeholder="Indirizzo completo">
        </div>
    </div>
    <div class="input-group">
        <div class="field-container">
            <span class="field-icon">📱</span>
            <input type="tel" id="telefono" placeholder="Cellulare">
        </div>
    </div>

    <div class="input-group">
        <label>Prodotto</label>
        <div class="field-container">
            <span class="field-icon">🔥</span>
            <input type="text" id="marca" placeholder="Marca stufa">
        </div>
    </div>

    <div class="input-group">
        <label>Servizio richiesto</label>
        <div class="select-wrapper">
            <div class="field-container">
                <span class="field-icon">🧰</span>
                <select id="tipoIntervento">
                    <option value="">Seleziona...</option>
                    <option value="Manutenzione">Manutenzione</option>
                    <option value="Riparazione">Riparazione</option>
                    <option value="Prima accensione">Prima accensione</option>
                </select>
            </div>
        </div>
    </div>

    <div id="sezioneProblemi">
        <div class="input-group">
            <label>Sintomo</label>
            <div class="select-wrapper">
                <div class="field-container">
                    <span class="field-icon">🛠️</span>
                    <select id="problema">
                        <option value="">Cosa succede?</option>
                        <option value="Mancata Accensione">Mancata Accensione (No fire)</option>
                        <option value="Errore sul display">Errore specifico sul display ⚠️</option>
                        <option value="Si spegne dopo l'avvio">Si spegne dopo l'avvio</option>
                        <option value="Vetro molto nero">Vetro si sporca subito</option>
                        <option value="Rumore eccessivo">Fa rumore strano</option>
                        <option value="Altro">Altro (scrivi nei dettagli)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group" id="erroriDisplayGroup" style="display:none;">
            <label>Codice Errore</label>
            <div class="select-wrapper">
                <div class="field-container">
                    <span class="field-icon">📟</span>
                    <select id="listaErrori">
                        <option value="">Quale errore leggi?</option>
                        <option value="Errore Sonda K">Errore Sonda K (Fumi)</option>
                        <option value="Errore Autopulizia">Errore Autopulizia</option>
                        <option value="Errore Pressione">Errore Pressione / Depressimetro</option>
                        <option value="Errore Debimetro">Errore Debimetro / Flusso</option>
                        <option value="Errore Porta Aperta">Errore Porta / Carico</option>
                        <option value="Errore Depressione">Errore Depressione</option>
                        <option value="Errore Sicurezza">Errore Sicurezza Termica (Reset)</option>
                        <option value="Allarme 1 - Blackout">AL 1 - Blackout</option>
                        <option value="Allarme 2 - Sonda Fumi">AL 2 - Sonda Fumi</option>
                        <option value="Allarme 3 - Hot Fumi">AL 3 - Hot Fumi (Sovratemperatura)</option>
                        <option value="Allarme 4 - Guasto Aspiratore">AL 4 - Guasto Aspiratore / Encoder</option>
                        <option value="Allarme 5 - Mancata Accensione">AL 5 - No Accensione / No Pellet</option>
                        <option value="Allarme 6 - No Pellet">AL 6 - Fine Pellet / No Fiamma</option>
                        <option value="Allarme 7 - Termico">AL 7 - Sicurezza Termica</option>
                        <option value="Allarme 8 - No Depressione">AL 8 - No Depressione / Canna Fumaria</option>
                        <option value="Allarme 9 - Coclea">AL 9 - Blocco Coclea / Triac</option>
                        <option value="Service">Scritta 'SERVICE' (Manutenzione scaduta)</option>
                        <option value="Altro">Altro errore non presente</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-group" id="altroBox" style="display:none;">
            <div class="field-container">
                <span class="field-icon">📝</span>
                <textarea id="problemaAltro" placeholder="Aggiungi dettagli extra..."></textarea>
            </div>
        </div>
    </div>

    <button id="mainBtn">Invia su WhatsApp</button>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3>Conferma Invio</h3>
        <p style="margin-bottom: 20px; font-size: 14px; color: #cbd5e1;">Vuoi inviare i dati all'assistenza tecnica?</p>
        <button class="ok" id="conferma">SÌ, INVIA</button>
        <button class="no" id="annulla">MODIFICA</button>
    </div>
</div>

<script>
    let messaggioWhatsApp = "";
    const tipoSelect = document.getElementById("tipoIntervento");
    const sezioneProblemi = document.getElementById("sezioneProblemi");
    const selectProblema = document.getElementById("problema");
    const erroriDisplayGroup = document.getElementById("erroriDisplayGroup");
    const altroBox = document.getElementById("altroBox");

    tipoSelect.onchange = function() {
        sezioneProblemi.style.display = (this.value === "Prima accensione") ? "none" : "block";
    };

    selectProblema.onchange = function() {
        erroriDisplayGroup.style.display = (this.value === "Errore sul display") ? "block" : "none";
        altroBox.style.display = (this.value === "Altro" || this.value === "Rumore eccessivo") ? "block" : "none";
    };

    document.getElementById("mainBtn").onclick = function() {
        const nome = document.getElementById("nome").value.trim();
        const cognome = document.getElementById("cognome").value.trim();
        const indirizzo = document.getElementById("indirizzo").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const marca = document.getElementById("marca").value.trim();
        const tipo = tipoSelect.value;

        if (!nome || !cognome || !indirizzo || !telefono || !marca || !tipo) {
            alert("Compila i campi obbligatori!");
            return;
        }

        let dettaglio = "";
        if (tipo !== "Prima accensione") {
            dettaglio = selectProblema.value;
            if (dettaglio === "Errore sul display") dettaglio = "Allarme: " + document.getElementById("listaErrori").value;
            if (document.getElementById("problemaAltro").value) dettaglio += " - Note: " + document.getElementById("problemaAltro").value;
        }

        const dataOggi = new Date().toLocaleDateString('it-IT');

        messaggioWhatsApp = `*🔥 PRENOTAZIONE INTERVENTO*\n` +
                            `👤 Cliente: ${nome} ${cognome}\n` +
                            `📍 Indirizzo: ${indirizzo}\n` +
                            `📱 WhatsApp: ${telefono}\n` +
                            `🔥 Stufa: ${marca}\n` +
                            `🧰 Servizio: ${tipo}\n` +
                            (dettaglio ? `🛠️ Problema: ${dettaglio}\n` : "") +
                            `📅 Data: ${dataOggi}`;

        document.getElementById("modal").style.display = "flex";
    };

    document.getElementById("annulla").onclick = () => document.getElementById("modal").style.display="none";
    
    document.getElementById("conferma").onclick = () => {
        const url = "https://wa.me/390813769280?text=" + encodeURIComponent(messaggioWhatsApp);
        window.open(url, "_blank");
        document.getElementById("modal").style.display="none";
    };
</script>
</body>
</html>
