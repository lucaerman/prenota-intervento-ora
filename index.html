<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta property="og:title" content="Prenotazione Intervento Tecnico">
    <meta property="og:description" content="Invia la tua richiesta di assistenza rapidamente via WhatsApp.">
    <meta property="og:image" content="https://lucaerman.github.io/prenota-intervento-ora/icon-512.png">
    <meta property="og:url" content="https://lucaerman.github.io/prenota-intervento-ora/">
    <meta property="og:type" content="website">

    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Assistenza">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <title>Prenotazione Intervento</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px; 
            overflow-x: hidden; 
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        .skeleton-overlay { position: absolute; width: 100%; max-width: 420px; padding: 25px; opacity: 0.15; filter: blur(4px); pointer-events: none; }
        .sk-box { background: #fff; height: 120px; border-radius: 20px; width: 100%; margin-bottom: 20px; }
        .sk-line { background: #fff; height: 45px; border-radius: 12px; margin-bottom: 15px; width: 100%; }
        .splash-logo { font-size: 90px; margin-bottom: 15px; animation: splashPulse 1.25s infinite alternate ease-in-out; filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.5)); z-index: 2; }
        @keyframes splashPulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        .loading-text { color: white; font-size: 14px; font-weight: 700; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; z-index: 2; opacity: 0.8; }
        .loader-container { width: 240px; height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 2; }
        .loader-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e); animation: loadProgress 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
        @keyframes loadProgress { 100% { width: 100%; } }

        /* --- CONTAINER --- */
        .container { 
            width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border-radius: 25px; padding: 25px; 
            border: 1px solid rgba(255,255,255,0.1); border-top: 1px solid rgba(255,255,255,0.3);
            opacity: 0; transform: translateY(30px); 
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s, border 0.4s, box-shadow 0.4s;
        }
        .container.active { opacity: 1; transform: translateY(0); }

        h2 { color: #fff; text-align: center; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 30px; }
        
        /* --- PROGRESS BAR NUOVA --- */
        .progress-wrapper { position: relative; margin-bottom: 30px; }
        .progress-container { 
            width: 100%; background: rgba(255, 255, 255, 0.05); border-radius: 20px; 
            height: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .progress-fill { 
            height: 100%; width: 0%; background: linear-gradient(90deg, #ef4444, #eab308, #22c55e); 
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); 
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
            border-radius: 20px;
        }
        .progress-text { 
            position: absolute; top: -22px; right: 5px; 
            font-size: 11px; font-weight: 900; color: #22c55e; 
            letter-spacing: 1px;
        }

        label { font-size: 10px; color: #aaa; margin: 0 0 5px 5px; display: block; text-transform: uppercase; font-weight: 700; transition: 0.3s; }
        .input-group, .field-row { margin-bottom: 15px; position: relative; }
        
        input, select, textarea { 
            width: 100%; padding: 12px 35px 12px 38px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255, 255, 255, 0.05); 
            color: #fff; font-size: 15px; outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        input.valid, select.valid, textarea.valid {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.1) !important;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
        }

        .field-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; transition: 0.3s; opacity: 0.5; }
        input.valid + .field-icon, select.valid + .field-icon { opacity: 1; transform: translateY(-50%) scale(1.2); }
        
        .check-status { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #22c55e; opacity: 0; transition: 0.3s; }
        input.valid ~ .check-status, select.valid ~ .check-status { opacity: 1; }

        /* --- WHATSAPP PREVIEW --- */
        .chat-preview { margin-top: 15px; display: none; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 15px; border: 1px solid rgba(37, 211, 102, 0.3); animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-bubble { 
            background: #25d366; color: #fff; padding: 10px 14px; border-radius: 12px; 
            max-width: 90%; margin-left: auto; font-size: 13px; line-height: 1.4; 
            position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.2); white-space: pre-line;
        }
        .chat-bubble::after { 
            content: ""; position: absolute; right: -6px; top: 8px; width: 0; height: 0; 
            border-left: 6px solid #25d366; border-top: 6px solid transparent; border-bottom: 6px solid transparent; 
        }

        /* --- BOTTONE WHATSAPP --- */
        button#mainBtn { 
            width: 100%; height: 58px; margin-top: 15px; border: none; border-radius: 14px; 
            background: linear-gradient(45deg, #25d366, #128c7e, #25d366); 
            background-size: 200% auto;
            color: white; font-weight: 900; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        button#mainBtn:hover { background-position: right center; }
        button#mainBtn:active { transform: scale(0.96); }

        .btn-content { display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .loading-spinner { 
            display: none; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); 
            border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; 
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .box { background: #0f172a; padding: 25px; border-radius: 20px; text-align: center; width: 90%; max-width: 320px; border: 1px solid #22c55e; }
        .ok { background: #22c55e; width: 100%; padding: 12px; border:none; border-radius: 10px; color: white; font-weight: bold; margin-bottom: 10px; cursor: pointer;}
        .no { background: transparent; color: #aaa; border: none; cursor: pointer; padding: 10px; }
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="skeleton-overlay"><div class="sk-box"></div><div class="sk-line"></div><div class="sk-line"></div></div>
    <div class="splash-logo">🔥</div>
    <div class="loading-text">CARICAMENTO ASSISTENZA...</div>
    <div class="loader-container"><div class="loader-bar"></div></div>
</div>

<div class="container" id="mainContainer">
    <h2>🔥 PRENOTA INTERVENTO</h2>

    <div class="progress-wrapper">
        <div class="progress-text" id="progressText">0%</div>
        <div class="progress-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="input-group">
        <label>Anagrafica</label>
        <input type="text" id="nomeCompleto" placeholder="Nome e Cognome">
        <span class="field-icon">👤</span>
        <span class="check-status">✓</span>
    </div>

    <div class="input-group">
        <input type="text" id="indirizzo" placeholder="Indirizzo e Civico">
        <span class="field-icon">📍</span>
        <span class="check-status">✓</span>
    </div>

    <div class="field-row" style="display: flex; gap: 10px;">
        <div style="flex: 2; position: relative;">
            <input type="text" id="citta" list="listaCitta" placeholder="Città">
            <datalist id="listaCitta"></datalist>
            <span class="field-icon">🏙️</span>
        </div>
        <div style="flex: 1; position: relative;">
            <input type="text" id="provincia" placeholder="Prov." maxlength="2">
            <span class="field-icon">🏛️</span>
        </div>
    </div>

    <div class="field-row" style="display: flex; gap: 10px;">
        <div style="flex: 1; position: relative;">
            <input type="tel" id="telefono" placeholder="Cellulare">
            <span class="field-icon">📱</span>
        </div>
        <div style="flex: 1; position: relative;">
            <input type="tel" id="fisso" placeholder="Fisso (opz)">
            <span class="field-icon">📞</span>
        </div>
    </div>

    <label>Prodotto</label>
    <div class="field-row" style="display: flex; gap: 10px;">
        <input type="text" id="marca" placeholder="Marca" style="flex:1">
        <input type="text" id="modello" placeholder="Modello" style="flex:1">
    </div>

    <div class="input-group">
        <select id="tipoIntervento">
            <option value="">Tipo intervento...</option>
            <option value="Manutenzione">Manutenzione</option>
            <option value="Riparazione">Riparazione</option>
            <option value="Prima accensione">Prima accensione</option>
        </select>
        <span class="field-icon">🧰</span>
        <span class="check-status">✓</span>
    </div>

    <div id="sezioneProblemi">
        <label>Dettagli Guasto</label>
        <div class="input-group">
            <select id="problema">
                <option value="">Problema riscontrato...</option>
                <option value="Errore sul display">Errore sul display ⚠️</option>
                <option value="Mancata Accensione">Mancata Accensione</option>
                <option value="Si spegne da sola">Si spegne da sola</option>
                <option value="Vetro molto nero">Il vetro si sporca subito</option>
                <option value="Rumore eccessivo">Fa un rumore anomalo</option>
                <option value="Altro">Altro (specifica sotto)</option>
            </select>
            <span class="check-status">✓</span>
        </div>

        <div id="erroriDisplayGroup" style="display:none; margin-bottom:15px;">
            <select id="listaErrori">
                <option value="">Seleziona l'allarme...</option>
                <option value="AL 1 - Blackout">AL 1 - Blackout / Mancanza Rete</option>
                <option value="AL 2 - Sonda Fumi">AL 2 - Sonda Fumi Guasta</option>
                <option value="AL 3 - Hot Fumi">AL 3 - Hot Fumi (Eccessivo Calore)</option>
                <option value="AL 4 - Aspiratore">AL 4 - Guasto Estrattore Fumi</option>
                <option value="AL 5 - No Accensione">AL 5 - Mancata Accensione</option>
                <option value="AL 6 - No Pellet">AL 6 - Mancanza Pellet / Fiamma</option>
                <option value="AL 7 - Termico">AL 7 - Sicurezza Termica (Reset)</option>
                <option value="AL 8 - No Depressione">AL 8 - Errore Depressione / Canna Fumaria</option>
                <option value="AL 9 - Coclea">AL 9 - Blocco Sistema Carico Pellet</option>
                <option value="SERVICE/PULIZIA">SERVICE/PULIZIA</option>
                <option value="Errore Triac Coclea">Errore Triac Coclea</option>
                <option value="Errore Sonda K">Errore Sonda K</option>
                <option value="Errore Pulizia braciere">Errore Pulizia braciere</option>
                <option value="Errore Pressione Alta">Errore Pressione Alta</option>
                <option value="Errore Pressione Bassa">Errore Pressione Bassa</option>
                <option value="Errore Debimetro/No flusso">Errore Debimetro/No flusso</option>
                <option value="Errore Porta Apert/sportello pellet">Errore Porta Aperta/sportello pellet</option>
                <option value="Errore NO SEGNALE">Errore NO SEGNALE</option>
                <option value="Altro">Altro errore non in lista</option>
            </select>
        </div>
        <textarea id="problemaAltro" placeholder="Descrivi qui i dettagli..." style="display:none; margin-bottom:15px; min-height:80px;"></textarea>
    </div>

    <div class="chat-preview" id="chatPreview">
        <div class="chat-bubble" id="chatBubble"></div>
    </div>

    <button id="mainBtn">
        <div class="btn-content" id="btnNormal">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.412 2.503 1.112 3.487l-.751 2.733 2.8-.735c.94.512 2.017.807 3.16.808 3.181 0 5.767-2.584 5.768-5.764 0-3.18-2.584-5.767-5.764-5.767l-.157.002zm3.39 8.161c-.054.154-.312.28-.43.292-.117.012-.228.024-.76-.174-.532-.198-1.441-.62-2.022-1.202-.582-.581-1.025-1.28-1.246-1.658-.222-.379-.024-.584.174-.783.198-.199.379-.443.568-.665.19-.222.253-.379.379-.632.127-.254.063-.475-.032-.665-.095-.19-.854-2.062-.1.171-2.854-.684-.684-1.03-1.03-1.03-.43s0-.776.33-1.12c.33-.344.444-.444.665-.886.222-.444.111-.842 0-1.112-.111-.271-.992-2.392-1.362-3.284-.361-.869-.728-.751-1.032-.765-.266-.012-.57-.015-.875-.015-.304 0-.799.114-1.218.571-.419.456-1.597 1.558-1.597 3.799 0 2.242 1.635 4.412 1.862 4.717.228.304 3.22 4.917 7.802 6.892 1.09.47 1.942.75 2.604.959 1.095.348 2.091.3 2.879.183.879-.13 2.698-1.103 3.078-2.171.381-1.068.381-1.984.267-2.171-.114-.187-.419-.304-.887-.538zM12 1c-6.075 0-11 4.925-11 11s4.925 11 11 11 11-4.925 11-11-4.925-11-11-11zm0 2c4.97 0 9 4.03 9 9s-4.03 9-9 9-9-4.03-9-9 4.03-9 9-9z"/></svg>
            <span>PRENOTA SU WHATSAPP</span>
        </div>
        <div class="loading-spinner" id="btnLoading"></div>
    </button>
</div>

<div class="modal" id="modal">
    <div class="box">
        <h3>Conferma Invio</h3>
        <p style="color:#ccc; font-size:14px; margin: 15px 0;">Vuoi procedere con l'invio del messaggio?</p>
        <button class="ok" id="conferma">SÌ, PROCEDI</button>
        <button class="no" id="annulla">MODIFICA</button>
    </div>
</div>

<script>
    const comuniNA = ["Acerra","Afragola","Agerola","Anacapri","Arzano","Bacoli","Barano d'Ischia","Boscoreale","Boscotrecase","Calvizzano","Casalnuovo di Napoli","Casamarciano","Casamicciola Terme","Casandrino","Casavatore","Casola di Napoli","Casoria","Castellammare di Stabia","Castello di Cisterna","Cercola","Cicciano","Cimitile","Comiziano","Crispano","Ercolano","Forio","Frattamaggiore","Frattaminore","Giugliano in Campania","Gragnano","Grumo Nevano","Ischia","Lacco Ameno","Lettere","Liveri","Marano di Napoli","Mariglianella","Marigliano","Massa Lubrense","Massa di Somma","Melito di Napoli","Meta","Monte di Procida","Mugnano di Napoli","Napoli","Nola","Ottaviano","Palma Campania","Piano di Sorrento","Pimonte","Poggiomarino","Pollena Trocchia","Pomigliano d'Arco","Pompei","Portici","Pozzuoli","Procida","Qualiano","Quarto","Roccarainola","San Gennaro Vesuviano","San Giorgio a Cremano","San Giuseppe Vesuviano","San Paolo Bel Sito","San Sebastiano al Vesuvio","San Vitaliano","Sant'Agnello","Sant'Anastasia","Sant'Antimo","Sant'Antonio Abate","Santa Maria la Carità","Saviano","Scisciano","Serrara Fontana","Somma Vesuviana","Sorrento","Striano","Terzigno","Torre Annunziata","Torre del Greco","Trecase","Tufino","Vico Equense","Villaricca","Visciano","Volla"];
    const comuniSA = ["Acerno","Agropoli","Albanella","Alfano","Altavilla Silentina","Amalfi","Angri","Aquara","Ascea","Atena Lucana","Atrani","Auletta","Baronissi","Battipaglia","Bellizzi","Bellosguardo","Bracigliano","Buccino","Buonabitacolo","Caggiano","Calvanico","Camerota","Campagna","Campora","Cannalonga","Capaccio Paestum","Casal Velino","Casalbuono","Casaletto Spartano","Caselle in Pittari","Castel San Giorgio","Castel San Lorenzo","Castelcivita","Castellabate","Castelnuovo Cilento","Castelnuovo di Conza","Castiglione del Genovesi","Cava de' Tirreni","Celle di Bulgheria","Centola","Ceraso","Cetara","Cicerale","Contursi Terme","Corbara","Corleto Monforte","Cuccaro Vetere","Eboli","Felitto","Fisciano","Furore","Futani","Giffoni Sei Casali","Giffoni Valle Piana","Gioi","Giungano","Ispani","Laureana Cilento","Laurino","Laurito","Laviano","Lustra","Magliano Vetere","Maiori","Mercato San Severino","Minori","Moio della Civitella","Montano Antilia","Monte San Giacomo","Montecorice","Montecorvino Pugliano","Montecorvino Rovella","Monteforte Cilento","Montesano sulla Marcellana","Morigerati","Nocera Inferiore","Nocera Superiore","Novi Velia","Ogliastro Cilento","Olevano sul Tusciano","Oliveto Citra","Omignano","Orria","Ottati","Padula","Pagani","Palomonte","Pellezzano","Perdifumo","Perito","Pertosa","Petina","Piaggine","Pisciotta","Polla","Pollica","Pontecagnano Faiano","Positano","Postiglione","Praiano","Prignano Cilento","Ravello","Ricigliano","Roccadaspide","Roccagloriosa","Roccapiemonte","Rofrano","Romagnano al Monte","Roscigno","Rutino","Sacco","Sala Consilina","Salento","Salerno","San Cipriano Picentino","San Giovanni a Piro","San Gregorio Magno","San Mango Piemonte","San Marzano sul Sarno","San Mauro Cilento","San Mauro la Bruca","San Pietro al Tanagro","San Rufo","San Valentino Torio","Santa Marina","Sant'Angelo a Fasanella","Sant'Arsenio","Sant'Egidio del Monte Albino","Sapri","Sarno","Sassano","Scafati","Scala","Serramezzana","Serre","Sessa Cilento","Siano","Sicignano degli Alburni","Stella Cilento","Stio","Teggiano","Torchiara","Torraca","Torre Orsaia","Tortorella","Tramonti","Trentinara","Valva","Vallo della Lucania","Vibonati","Vietri sul Mare"];

    function popola() {
        const dl = document.getElementById("listaCitta");
        const tutti = [...comuniNA.map(c => ({n:c, p:"NA"})), ...comuniSA.map(c => ({n:c, p:"SA"}))];
        tutti.sort((a,b) => a.n.localeCompare(b.n)).forEach(c => {
            let o = document.createElement("option"); o.value = c.n; o.dataset.p = c.p; dl.appendChild(o);
        });
    }

    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('splash-screen').style.visibility = 'hidden'; 
                document.getElementById('mainContainer').classList.add('active'); 
            }, 800);
        }, 2000);
    });

    const fields = ["nomeCompleto","indirizzo","citta","provincia","telefono","fisso","marca","modello","tipoIntervento", "problema", "listaErrori", "problemaAltro"];
    fields.forEach(id => {
        const el = document.getElementById(id);
        if(!el) return;
        const saved = localStorage.getItem(id);
        if(saved) { el.value = saved; valida(el); }
        el.addEventListener("input", () => { localStorage.setItem(id, el.value); valida(el); updateUI(); });
    });

    function valida(el) {
        if(el.value.trim().length >= 2) el.classList.add("valid");
        else el.classList.remove("valid");
    }

    document.getElementById("citta").addEventListener("change", function() {
        const opts = document.getElementById("listaCitta").childNodes;
        for(let i=0; i<opts.length; i++) {
            if(opts[i].value === this.value) {
                const prov = document.getElementById("provincia");
                prov.value = opts[i].dataset.p; valida(prov); break;
            }
        }
        updateUI();
    });

    function updateUI() {
        const d = (id) => document.getElementById(id).value.trim();
        const container = document.getElementById("mainContainer");
        const essential = ["nomeCompleto", "indirizzo", "citta", "telefono", "marca", "tipoIntervento"];
        let filled = 0;
        essential.forEach(id => { if(d(id)) filled++; });
        const percent = Math.round((filled/essential.length)*100);
        
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("progressText").innerText = percent + "%";

        if (percent > 0) {
            container.style.border = `1px solid rgba(34, 197, 94, ${percent / 100})`;
            container.style.boxShadow = `0 0 ${percent / 5}px rgba(34, 197, 94, ${percent / 200})`;
        }

        const chat = document.getElementById("chatPreview");
        const bubble = document.getElementById("chatBubble");
        let txt = "";
        if(d("nomeCompleto")) txt += `👤 ${d("nomeCompleto")}\n`;
        if(d("indirizzo")) txt += `📍 ${d("indirizzo")} - ${d("citta")}\n`;
        if(d("marca")) txt += `🔥 ${d("marca")} ${d("modello")}\n`;
        if(d("tipoIntervento")) txt += `🧰 ${d("tipoIntervento")}`;

        if(txt !== "") { chat.style.display = "block"; bubble.innerText = txt; }
        else { chat.style.display = "none"; }

        document.getElementById("sezioneProblemi").style.display = (d("tipoIntervento") === "Prima accensione") ? "none" : "block";
    }

    document.getElementById("problema").addEventListener("change", function() {
        document.getElementById("erroriDisplayGroup").style.display = (this.value === "Errore sul display") ? "block" : "none";
        document.getElementById("problemaAltro").style.display = (this.value === "Altro" || this.value === "Rumore eccessivo") ? "block" : "none";
        valida(this);
        updateUI();
    });

    // --- INVIO ---
    const mainBtn = document.getElementById("mainBtn");
    const btnNormal = document.getElementById("btnNormal");
    const btnLoading = document.getElementById("btnLoading");

    mainBtn.onclick = function() {
        const nome = document.getElementById("nomeCompleto").value.trim();
        const tel = document.getElementById("telefono").value.trim();
        if(!nome || !tel) { alert("Per favore, inserisci Nome e Telefono."); return; }
        document.getElementById("modal").style.display = "flex";
    };

    document.getElementById("conferma").onclick = function() {
        const d = (id) => document.getElementById(id).value.trim();
        let dettaglio = d("problema");
        if(dettaglio === "Errore sul display") dettaglio = "Allarme: " + d("listaErrori");
        const notaAltro = d("problemaAltro");
        if(notaAltro) dettaglio += " - Note: " + notaAltro;

        const msg = `*🔥 RICHIESTA ASSISTENZA*\n👤 *Cliente:* ${d("nomeCompleto")}\n📍 *Indirizzo:* ${d("indirizzo")} - ${d("citta")} (${d("provincia")})\n📱 *Tel:* ${d("telefono")}\n🔥 *Stufa:* ${d("marca")} ${d("modello")}\n🧰 *Servizio:* ${d("tipoIntervento")}\n🛠️ *Dettaglio:* ${dettaglio}`;
        const url = `https://api.whatsapp.com/send?phone=390813769280&text=${encodeURIComponent(msg)}`;

        btnNormal.style.display = "none";
        btnLoading.style.display = "block";
        document.getElementById("modal").style.display = "none";
        
        window.location.href = url;

        setTimeout(() => {
            btnNormal.style.display = "flex";
            btnLoading.style.display = "none";
        }, 2000);
    };

    document.getElementById("annulla").onclick = () => document.getElementById("modal").style.display="none";

    popola(); updateUI();
</script>
</body>
</html>
