<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione intervento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

body{
    background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617);
    min-height:100vh;
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    display:flex;
    justify-content:center;
    padding:20px 0;
}

/* CONTAINER */
.container{
    position:relative;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.2);
}

/* TITOLO */
h2{
    text-align:center;
    color:#fff;
    margin-bottom:20px;
    font-size:26px;
    animation:titlePulse 1s infinite alternate;
    position:relative;
}

.fire{
    display:inline-block;
    animation:fireContinuous 1s infinite alternate;
}

@keyframes fireContinuous{
    0% { transform: scale(1.1) rotate(-5deg); text-shadow:0 0 5px #ff9800,0 0 15px #ff5722,0 0 25px #ff0000;}
    100% { transform: scale(1.3) rotate(5deg); text-shadow:0 0 12px #ff9800,0 0 30px #ff5722,0 0 45px #ff0000;}
}

@keyframes titlePulse{
    0% {transform: scale(1) rotate(-2deg); text-shadow:0 0 5px #ff9800,0 0 10px #ff5722;}
    50% {transform: scale(1.1) rotate(2deg); text-shadow:0 0 15px #ff9800,0 0 25px #ff5722,0 0 40px #ff0000;}
    100% {transform: scale(1) rotate(-2deg); text-shadow:0 0 5px #ff9800,0 0 10px #ff5722;}
}

/* SCINTILLE DEL TITOLO */
.spark{
    position:absolute;
    width:4px;
    height:4px;
    background:#ffec00;
    border-radius:50%;
    opacity:0;
    animation:sparkAnim 1.2s infinite;
}

@keyframes sparkAnim{
    0% { transform: translate(0,0) scale(0.5); opacity:1; }
    50% { transform: translate(calc(var(--x)*1px), calc(var(--y)*1px)) scale(1); opacity:0.5; }
    100% { transform: translate(calc(var(--x)*2px), calc(var(--y)*2px)) scale(0); opacity:0; }
}

/* INPUT */
.input-group{
    position:relative;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:14px 14px 14px 45px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#f0f0f0;
    outline:none;
    transition: transform 0.2s;
}

textarea{
    width:100%;
    min-height:90px;
    padding:14px 14px 14px 45px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#f0f0f0;
    outline:none;
    resize:none;
}

input::placeholder, textarea::placeholder{
    color:#ddd;
}

input:focus,select:focus,textarea:focus{
    background:rgba(255,255,255,0.25);
    transform:scale(1.02);
}

/* ICONE */
.icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:0.8;
    transition: transform 0.2s;
}

.input-group input:focus + .icon,
.input-group select:focus + .icon,
.input-group textarea:focus + .icon{
    animation:iconPulse 0.5s infinite alternate;
}

@keyframes iconPulse{
    0%{transform:translateY(-50%) scale(1);}
    50%{transform:translateY(-50%) scale(1.3);}
    100%{transform:translateY(-50%) scale(1);}
}

/* ERRORE */
.error{
    border:2px solid red !important;
}

/* BOTTONE WHATSAPP */
button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    position:relative;
    overflow:hidden;
    animation:pulse 2s infinite;
}

.whatsapp-icon{
    width:24px;
    animation:iconBounce 1.2s infinite;
}

@keyframes iconBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
}

@keyframes pulse{
    0%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
    50%{ box-shadow:0 0 25px rgba(34,197,94,1);}
    100%{ box-shadow:0 0 10px rgba(34,197,94,0.6);}
}

button::before{
    content:"";
    position:absolute;
    width:200%;
    height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.7),transparent);
    top:0;
    left:-100%;
    animation:shine 3s infinite;
}

@keyframes shine{
    0%{left:-100%;}
    50%{left:100%;}
    100%{left:100%;}
}

/* TESTO SOTTO BOTTONE */
.animatedText{
    text-align:center;
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
    color:red;
    animation:textPulse 1.5s infinite alternate;
    text-shadow:0 0 5px #ff0000,0 0 15px #ff5555;
}

@keyframes textPulse{
    0%{transform:scale(1);text-shadow:0 0 5px #ff0000,0 0 10px #ff5555;}
    50%{transform:scale(1.1);text-shadow:0 0 10px #ff0000,0 0 20px #ff8888,0 0 25px #ff0000;}
    100%{transform:scale(1);text-shadow:0 0 5px #ff0000,0 0 10px #ff5555;}
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(6px);
}

.box{
    background:#020617;
    color:#fff;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

/* SUCCESS IOS */
.successOverlay{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:0.4s;
}

.successOverlay.active{
    opacity:1;
}

.successBox{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:scale(0.5);
    animation:pop 0.5s forwards;
}

@keyframes pop{
    to{transform:scale(1);}
}

.check{
    font-size:50px;
    color:white;
    animation:fadeIn 0.5s 0.3s forwards;
    opacity:0;
}

@keyframes fadeIn{
    to{opacity:1;}
}

/* SFONDO ANIMATO SCINTILLE PELLET */
#sparkContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.sparkParticle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:orange;
    opacity:0.8;
    animation:rise 2s linear infinite;
}

@keyframes rise{
    0% { transform: translateY(0) scale(0.5); opacity:1; }
    80% { transform: translateY(-200px) scale(1); opacity:0.5; }
    100% { transform: translateY(-250px) scale(0); opacity:0; }
}
</style>
</head>

<body>

<div id="sparkContainer"></div>

<div class="container">

<h2>
<span class="fire">🔥</span> Prenota intervento
<div class="spark" style="--x:10; --y:-20;"></div>
<div class="spark" style="--x:-15; --y:-25;"></div>
<div class="spark" style="--x:5; --y:-30;"></div>
</h2>

<div class="input-group"><input id="nome" placeholder="Nome"><span class="icon">👤</span></div>
<div class="input-group"><input id="cognome" placeholder="Cognome"><span class="icon">👤</span></div>
<div class="input-group"><input id="indirizzo" placeholder="Indirizzo"><span class="icon">📍</span></div>
<div class="input-group"><input id="telefono" placeholder="Telefono"><span class="icon">📞</span></div>
<div class="input-group"><input id="fisso" placeholder="Numero fisso (facoltativo)"><span class="icon">☎️</span></div>
<div class="input-group"><input id="marca" placeholder="Marca stufa"><span class="icon">🔥</span></div>
<div class="input-group"><input id="modello" placeholder="Modello stufa (facoltativo)"><span class="icon">🏷️</span></div>

<div class="input-group">
<span class="icon">🛠</span>
<select id="tipo">
<option value="">Tipo intervento</option>
<option>Manutenzione</option>
<option>Riparazione</option>
<option>Prima accensione</option>
</select>
</div>

<div class="input-group">
<span class="icon">📝</span>
<textarea id="note" placeholder="Descrivi brevemente il problema (facoltativo)"></textarea>
</div>

<div class="input-group">
<span class="icon">📅</span>
<input id="data" readonly>
</div>

<button id="btn">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="whatsapp-icon">
Prenota su WhatsApp
</button>

<div class="animatedText">Compila e prenota!!</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">
<h3>Conferma invio</h3>
<button onclick="invia()">Invia</button>
<button onclick="modal.style.display='none'">Annulla</button>
</div>
</div>

<!-- SUCCESS -->
<div class="successOverlay" id="success">
<div class="successBox">
<div class="check">✓</div>
</div>
</div>

<script>
data.value=new Date().toLocaleDateString("it-IT");

let msg="";

btn.onclick=()=>{

let campi=["nome","cognome","indirizzo","telefono","marca","tipo"];
let ok=true;

campi.forEach(id=>{
let el=document.getElementById(id);
el.classList.remove("error");
if(!el.value){
el.classList.add("error");
ok=false;
}
});

if(!ok) return;

if(navigator.vibrate) navigator.vibrate(150);

msg=`Prenotazione intervento

Nome: ${nome.value} ${cognome.value}
Indirizzo: ${indirizzo.value}
Telefono: ${telefono.value}
${fisso.value ? "Numero fisso: " + fisso.value : ""}

Marca: ${marca.value}
${modello.value ? "Modello: " + modello.value : ""}
Tipo: ${tipo.value}
Data: ${data.value}

${note.value ? "Problema: " + note.value : ""}`;

modal.style.display="flex";

};

function invia(){

modal.style.display="none";
if(navigator.vibrate) navigator.vibrate(200);
success.classList.add("active");

setTimeout(()=>{
success.classList.remove("active");
window.open("https://wa.me/390813769280?text="+encodeURIComponent(msg));
},1500);

}

// ANIMAZIONE SCINTILLE PELLET
const sparkContainer = document.getElementById("sparkContainer");

function createSpark(){
    const spark = document.createElement("div");
    spark.className = "sparkParticle";
    spark.style.left = Math.random() * window.innerWidth + "px";
    spark.style.top = window.innerHeight + "px";
    spark.style.animationDuration = (1.5 + Math.random()*1) + "s";
    sparkContainer.appendChild(spark);
    setTimeout(()=> spark.remove(), 2000);
}

setInterval(createSpark, 150);

</script>

</body>
</html>
